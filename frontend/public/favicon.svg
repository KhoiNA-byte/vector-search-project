<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="logoGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#73BB6C"/>
      <stop offset="100%" stop-color="#4A9958"/>
    </linearGradient>
  </defs>

  <!-- Circular background for the emblem -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" stroke="#FFFFFF" stroke-width="5"/>

  <!-- Fruit Emblem (Stylized Apple/Search Icon Combo) -->
  <!-- Search Icon "lens" and stem combined as a stylized fruit shape -->
  <g transform="translate(10, -5)"> <!-- Offset slightly to align within the circle -->
    <!-- Stylized search lens/fruit body -->
    <path d="M125 105C125 129.853 104.853 150 80 150C55.1472 150 35 129.853 35 105C35 80.1472 55.1472 60 80 60C104.853 60 125 80.1472 125 105Z" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none"/>
    
    <!-- Stylized stem/search handle -->
    <path d="M115 135L150 170" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Inner fruit core/magnifying effect -->
    <circle cx="80" cy="105" r="30" fill="#FFFFFF"/>
    <ellipse cx="80" cy="105" rx="15" ry="25" fill="#4A9958"/> <!-- Green core/seed -->
  </g>
</svg>